name: CI

# Build the Aether toolchain from source, then run aeb's unit test suite
# (tests/run.sh) on every push to main and every PR. This is the quality
# gate the repo was missing: for a long time the only workflow was the
# now-removed `autotag.yml`, so nothing verified that the SDKs, tools, and
# cache wiring actually compile and pass their assertions. Since releases
# became explicit-tag-only, this is what a push to main runs — so it is
# the ONLY thing standing between a bad commit and a tag someone cuts from
# it. The suite is fast and needs no language toolchains
# beyond a JDK (test_java_cache probes `javac -version`); every other
# cache/SDK test tolerates an absent toolchain by design.
#
# aeb is written in Aether, so CI must first obtain `ae`. We build it from
# the aether repo (aether-lang-dev/aether) with its own supported
# `install.sh` — the same path a developer uses — pinned by the
# `aether_ref` input (default: main, which carries the fixes aeb depends
# on). aether's CI build recipe (ubuntu-22.04 + gcc/make/bc/pkg-config/
# libgtk-4-dev) is mirrored here so the toolchain build is a proven path.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      aether_ref:
        description: "aether git ref to build (branch, tag, or sha)"
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Linux / ${{ github.event.inputs.aether_ref || 'main' }})
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout aeb
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Runs FIRST and costs ~1s: it needs no toolchain, and the failure it
      # catches is otherwise only discoverable by cutting a release.
      #
      # release.yml's steps run under `set -euo pipefail`, so ONE unset
      # variable aborts a step before any command in it executes — the
      # Publish step then fails with no `gh` output at all, which reads
      # like an auth problem. v0.281 tagged but never published exactly
      # that way: the notes grew seven inventory variables that were
      # computed in the stage step and never passed to Publish.
      - name: Lint workflow env wiring
        run: python3 tools/check-workflow-env.py .github/workflows/*.yml

      # JDK so test_java_cache's _jdk_version() (`javac -version`) is
      # non-empty; harmless for every other test.
      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Aether build deps
        run: |
          set -eux
          sudo apt-get update
          # Same dep set as aether's own CI (.github/workflows/ci.yml).
          sudo apt-get install -y gcc make bc pkg-config libgtk-4-dev

      - name: Checkout aether toolchain source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aether-lang-dev/aether
          ref: ${{ github.event.inputs.aether_ref || 'main' }}
          path: aether-src
          fetch-depth: 0   # install.sh derives its version via git describe

      - name: Build & install Aether
        run: |
          set -eux
          cd aether-src
          # install.sh builds (make) and installs to ~/.aether, registering
          # the version + `current` symlink; it skips editor extensions when
          # no editor is present (CI runner).
          ./install.sh
          # Put the `ae` launcher on PATH for subsequent steps.
          echo "$HOME/.aether/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -eux
          ae --version
          # Fail fast if a fresh compile is broken before running the suite.
          printf 'main() {\n  println("ci toolchain ok")\n}\n' > "$RUNNER_TEMP/probe.ae"
          ae build "$RUNNER_TEMP/probe.ae" -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"


      # Needs the toolchain: it reads that Aether's std/ to learn which C
      # symbols exist. Catches the class of bug that broke `make` outright
      # on aether >= 0.463 — three tools each defined a local
      # `string_replace_all`, and 0.463.0 added a C function with exactly
      # that name, so the linker saw two definitions. Checking against the
      # toolchain CI installs means a newly-added std symbol surfaces here
      # rather than in someone's build.
      - name: Check for std symbol collisions
        run: itests/std-symbol-collision.sh
      # Cold-compile gate: build a consumer node per SDK from a FRESH tree so
      # the fan-out orchestrator is regenerated + linked from scratch. Catches
      # the class that shipped in v0.311 — SDK-only helpers (mtime staleness
      # walk, classpath seq_filter) that type-check/link only when a CONSUMER
      # node pulls lib/<sdk> in, invisible to the warm unit suite below.
      - name: SDK cold-compile smoke
        run: itests/sdk-cold-compile-smoke.sh
      - name: --overrideDep node-substitution smoke
        run: itests/override-dep-smoke.sh
      # ae-add binary-package emitter: aeb builds an Aether .so and stages it as
      # an `ae add`-installable binary package (aether.toml [package] binary=,
      # per-triple lib, .sha256), then drives the REAL `ae add` round trip. The
      # ae add legs SKIP cleanly on ae < 0.694 (feature unsupported), so this is
      # green whatever ae the CI toolchain pins.
      - name: ae-add binary-package emitter smoke
        run: itests/ae-add-binary-package-smoke.sh
      # Aether >= 0.681 floor is enforced on the libaether.a aeb-link LINKS, so a
      # stale archive beside a current ae fails with a legible floor error rather
      # than a cryptic `undefined reference to os_arch_raw` (servirtium-vcr).
      - name: libaether 0.681 floor guard
        run: itests/libaether-floor-guard.sh
      # A node using the retired `build` module (pre-bldr grammar) gets a clear
      # migration diagnostic, not a cryptic "unresolved import 'build'" that reads
      # like an install problem (aeb#16).
      - name: retired build-grammar diagnostic
        run: itests/retired-build-grammar-diagnostic.sh
      # Structured node-failure capture: a failing node writes a JSON record to
      # target/_aeb/_failures.jsonl (label/node/tag/rc/phase/stderr_tail), across
      # all engines, reset at build start (aeb#9).
      - name: node-failure JSONL capture
        run: itests/failures-jsonl-capture.sh
      # Render-from-artifacts build report: aeb --report renders timing /
      # critical-path / cache purely from target/ artifacts, read-only, two graph
      # forms + text, composing with _failures.jsonl (aeb#12).
      - name: report-view render
        run: itests/report-view.sh
      # Inline telemetry verbosity dial: aeb --report=<tier>
      # (counts|targets|per-rule|full) filters what the [telemetry] block prints;
      # default unchanged (aeb#8).
      - name: report tiers
        run: itests/report-tiers.sh
      # Config precedence: --jobs N beats AEB_JOBS beats the nproc default (aeb#10).
      - name: config precedence (jobs flag > env)
        run: itests/config-precedence.sh
      # --watch validate-then-swap: a bad .build.ae edit keeps the last-good
      # build (prior binary still runs); a fix recovers (aeb#11). Drives the
      # rebuild path directly (no async watcher needed).
      - name: watch validate-then-swap
        run: itests/watch-validate-then-swap.sh
      - name: Run aeb unit test suite
        run: ./tests/run.sh

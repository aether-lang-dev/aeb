name: autotag

# Tag every push to main with the next sequential v0.NNN, so each
# pushed commit is a human-meaningful, ordered, pinnable ref. GitHub then
# serves a source tarball for it automatically
# (…/archive/refs/tags/v0.NNN.tar.gz), which an installer / a using-repo's
# bootstrap can pin to (`AEB_REF=v0.042`). These tags are pinnable
# markers, NOT sem-ver compatibility promises (aeb is pre-1.0, no
# sem-ver — see CONTRIBUTING.md).
#
# Pushing a tag does not re-trigger this workflow (it listens on branch
# pushes only), so there is no loop.

on:
  push:
    branches: [main]

# Serialize runs so two quick pushes can't both compute the same next
# number and collide on the tag.
concurrency:
  group: autotag
  cancel-in-progress: false

permissions:
  contents: write   # push the new tag via the default GITHUB_TOKEN

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0      # full history + all tags for the counter
          fetch-tags: true

      - name: Tag next v0.NNN
        id: tag
        run: |
          set -euo pipefail

          # Skip if this commit is already tagged v0.* (re-run / manual tag).
          if git tag --points-at HEAD | grep -q '^v0\.'; then
            echo "HEAD already carries a v0.* tag — nothing to do."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Highest existing counter (numeric, leading zeros stripped), or 0.
          latest=$(git tag --list 'v0.*' \
            | sed -n 's/^v0\.0*\([0-9][0-9]*\)$/\1/p' \
            | sort -n | tail -1)
          latest=${latest:-0}
          tag=$(printf 'v0.%03d' "$((latest + 1))")

          git config user.name  "aeb-autotag[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "aeb $tag (auto-tagged from $(git rev-parse --short HEAD))"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tagged and pushed $tag"

  # Cut the release for the tag we just pushed.
  #
  # WHY CALLED, NOT TRIGGERED. release.yml also declares `on: push: tags`,
  # but that can NEVER fire for these tags: GitHub deliberately suppresses
  # workflow triggers for pushes made with the default GITHUB_TOKEN, to
  # stop workflows looping. So the tag landed (v0.276 -> 54297df) and
  # release.yml simply never ran — no release, no .sha256, nothing to see.
  # Diagnosed the hard way by looking for the missing asset.
  #
  # Options were: (a) push tags with a PAT so the trigger fires, (b) call
  # the release workflow directly. (b) wins — no extra secret to hold,
  # rotate or leak, and the chain is visible in one file instead of being
  # an emergent property of token choice.
  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
